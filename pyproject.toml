# Development only: the skill's scripts are standalone `uv run` scripts with inline dependencies.
[project]
name = "app-wireframe"
version = "1.1.0"
description = "Agent skill that turns app screens into editable lo-fi wireframes on a Whimsical board."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pillow>=11,<13", "httpx>=0.27,<1", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B905"]
